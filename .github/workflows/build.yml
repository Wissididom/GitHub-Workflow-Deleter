name: Go Build

permissions:
  "contents": "write"

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

env:
  CGO_ENABLED: 0

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Compile (Windows)
        if: startsWith(matrix.os, 'windows')
        run: go build -o GitHub-Workflow-Deleter.exe
      - name: Compile (Ubuntu and Mac)
        if: startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos')
        run: go build -o GitHub-Workflow-Deleter
      - name: Upload artifact (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: actions/upload-artifact@v7
        with:
          name: GitHub-Workflow-Deleter-${{ matrix.os }}
          path: GitHub-Workflow-Deleter.exe
      - name: Upload artifact (Ubuntu and Mac)
        if: startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@v7
        with:
          name: GitHub-Workflow-Deleter-${{ matrix.os }}
          path: GitHub-Workflow-Deleter
  create-release:
    needs: [build]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v6
        name: Checkout Code

      # Windows
      - uses: actions/download-artifact@v8
        name: Download Windows
        with:
          name: GitHub-Workflow-Deleter-windows-latest
          path: release-artifacts/

      - name: Rename Windows Binary
        run: mv release-artifacts/GitHub-Workflow-Deleter.exe release-artifacts/GitHub-Workflow-Deleter-Windows.exe

      - uses: actions/download-artifact@v8
        name: Download Linux
        with:
          name: GitHub-Workflow-Deleter-ubuntu-latest
          path: release-artifacts/

      - name: Rename Linux Binary
        run: mv release-artifacts/GitHub-Workflow-Deleter release-artifacts/GitHub-Workflow-Deleter-Linux

      - uses: actions/download-artifact@v8
        name: Download Mac
        with:
          name: GitHub-Workflow-Deleter-macos-latest
          path: release-artifacts/

      - name: Rename Mac Binary
        run: mv release-artifacts/GitHub-Workflow-Deleter release-artifacts/GitHub-Workflow-Deleter-Mac

      - name: Create release
        uses: ncipollo/release-action@v1.20.0
        with:
          replacesArtifacts: true
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "release-artifacts/*"
          body: ${{ github.event.head_commit.message }}
          prerelease: true
          name: Nightly Release
          tag: nightly-build

      - name: Update nightly-build tag
        run: |
          git tag -f nightly-build
          git push -f origin nightly-build
        shell: bash
